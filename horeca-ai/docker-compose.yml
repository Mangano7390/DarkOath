services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: horeca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: horeca
      POSTGRES_PASSWORD: horeca
      POSTGRES_DB: horeca
    ports:
      - "5432:5432"
    volumes:
      - horeca_pgdata:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horeca -d horeca"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: horeca-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  horeca_pgdata:
